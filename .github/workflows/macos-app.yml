name: macOS Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/macos-app.yml"
      - "apps/macos/**"
      - "assets/**"
      - "host-shim/**"
      - "package/ego-browser/**"
      - "scripts/**"
      - "skills/oriel-browser/**"
      - "VERSION"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-app.yml"
      - "apps/macos/**"
      - "assets/**"
      - "host-shim/**"
      - "package/ego-browser/**"
      - "scripts/**"
      - "skills/oriel-browser/**"
      - "VERSION"
    tags:
      - "oriel-v*"

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate Oriel tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -nE 's/^VERSION=([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?)$/\1/p' VERSION)"
          expected="oriel-v${version}"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag must match VERSION exactly: $expected" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
        working-directory: package/ego-browser
      - run: ./scripts/verify-beta.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Oriel-macOS-${{ github.sha }}
          path: build/Oriel-*.dmg
          if-no-files-found: error
