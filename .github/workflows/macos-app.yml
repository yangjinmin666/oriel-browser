name: macOS App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/macos/**"
      - "host-shim/**"
      - "scripts/build-macos-app.sh"
      - "scripts/package-macos-dmg.sh"
      - "skills/zhiyou-browser/**"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
        working-directory: package/ego-browser
      - run: node --test host-shim/*.test.mjs
      - run: ./scripts/build-macos-app.sh
      - run: ./scripts/package-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZhiYou-macOS
          path: build/ZhiYou-0.2.0-alpha.dmg
