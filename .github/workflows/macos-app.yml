name: macOS App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/macos/**"
      - "assets/**"
      - "host-shim/**"
      - "package/ego-browser/**"
      - "scripts/**"
      - "skills/oriel-browser/**"
      - "VERSION"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
        working-directory: package/ego-browser
      - run: ./scripts/verify-beta.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Oriel-macOS
          path: build/Oriel-*.dmg
          if-no-files-found: error
