name: Bug report
description: Report a reproducible problem with Oriel.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Oriel. Please search existing issues first and include the smallest reliable reproduction you can provide.

        Oriel is `v0.2.0-alpha` and is not Developer ID signed or notarized. A Gatekeeper warning on first launch is a known limitation, not a bug. See [the first-open steps](https://github.com/yangjinmin666/oriel-browser/blob/main/README.md#opening-a-distributed-dmg-on-macos).

        For security vulnerabilities, use a [private security advisory](https://github.com/yangjinmin666/oriel-browser/security/advisories/new) instead.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Oriel macOS control center
        - Managed browser launch or connection
        - Oriel daemon or CLI
        - Agent integration or skill install (Codex / Claude Code)
        - Task space policy or approval
        - Site notes
        - Installation or first run
        - Other or unsure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
      placeholder: Tell us what went wrong. Include the exact error message when available.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, repeatable sequence. Include a heredoc or code sample when relevant.
      placeholder: |
        1. Open or navigate to ...
        2. Run ...
        3. Observe ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Paste the output of `oriel --doctor`. It reports the browser, config, daemon, CLI, and skill status separately.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the Oriel app version, and the managed browser you selected.
      placeholder: "Oriel 0.2.0-alpha (build 2); Tabbit"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your macOS version, CPU architecture, and agent or client.
      placeholder: "macOS 15.5, Apple Silicon, Codex CLI"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or attach screenshots. Remove tokens, cookies, personal data, and other secrets.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other details that may help, such as frequency, workarounds, or recent changes.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and sensitive browsing data from this report.
          required: true
