name: Feature request
description: Propose an improvement to Oriel.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the proposed implementation.

        Oriel deliberately does not accept requests to bypass CAPTCHAs, platform risk controls, or anti-abuse systems, or to automate bulk consequential actions such as mass messaging or applications.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Oriel macOS control center
        - Managed browser launch or connection
        - Oriel daemon or CLI
        - Agent integration or skill install (Codex / Claude Code)
        - Task space policy or approval
        - Site notes
        - Installation or first run
        - Documentation
        - Other or unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is difficult or impossible today, and who is affected?
      placeholder: When I try to ..., I cannot ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Keep the proposal focused on the smallest useful outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Add mockups, code samples, links, or examples from related tools when useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request describes one focused problem.
          required: true
        - label: This request does not ask Oriel to bypass a platform's security or anti-abuse controls.
          required: true
