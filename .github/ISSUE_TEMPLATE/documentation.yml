name: Documentation issue
description: Report missing, incorrect, or unclear documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: area
    attributes:
      label: Documentation area
      options:
        - Project README (English)
        - 项目 README（简体中文）
        - Beta guide
        - Architecture
        - Contributor guide
        - Agent skill instructions
        - Site notes
        - Other or unsure
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Provide the repository path and section, or a link to the rendered page.
      placeholder: "docs/BETA_GUIDE.md#... or skills/oriel-browser/SKILL.md#..."
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
      description: Explain what is missing, incorrect, outdated, or hard to understand.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Share the wording, example, or structure you think would help.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the current documentation and searched for an existing issue.
          required: true
